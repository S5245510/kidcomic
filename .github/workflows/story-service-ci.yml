name: Story Service CI/CD

# T076: Trigger on commits to Story Service
on:
  push:
    branches:
      - main
      - develop
      - '002-microservices-infra'
    paths:
      - 'services/story-service/**'
      - 'shared/**'
      - '.github/workflows/story-service-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/story-service/**'
      - 'shared/**'

env:
  SERVICE_NAME: story-service
  PYTHON_VERSION: '3.11'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/story-service

jobs:
  # T077: Lint stage - Code quality checks
  lint:
    name: Lint Code
    runs-on: windows-latest  # Windows runner per Constitution

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('services/story-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: services/story-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -r requirements.txt

      - name: Run Ruff linter
        working-directory: services/story-service
        run: ruff check src/

      - name: Run Black formatter check
        working-directory: services/story-service
        run: black --check src/

      - name: Run MyPy type checker
        working-directory: services/story-service
        run: mypy src/ --ignore-missing-imports
        continue-on-error: true  # Type hints are optional initially

  # T078: Unit test stage with 80% coverage requirement
  unit-test:
    name: Unit Tests
    runs-on: windows-latest
    needs: lint  # Run after lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('services/story-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: services/story-service
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        working-directory: services/story-service
        run: |
          pytest tests/unit/ `
            --cov=src `
            --cov-report=term-missing `
            --cov-report=xml `
            --cov-report=html `
            --cov-fail-under=80 `
            -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: services/story-service/coverage.xml
          flags: unittests
          name: story-service-coverage
        continue-on-error: true  # Don't fail if codecov is unavailable

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: services/story-service/htmlcov/

  # T079: Integration test stage with Testcontainers
  integration-test:
    name: Integration Tests
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Docker Desktop (if not present)
        run: |
          # Docker Desktop should be pre-installed on GitHub Actions Windows runners
          docker --version

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('services/story-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: services/story-service
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio testcontainers Pillow requests
          pip install -r requirements.txt

      - name: Run integration tests
        working-directory: services/story-service
        run: |
          pytest tests/integration/ -v --tb=short
        timeout-minutes: 15  # Testcontainers can be slow

      - name: Run service contract validation (T108)
        working-directory: .
        run: |
          # Run contract validation tests with proper environment
          $env:GATEWAY_URL = "http://localhost"
          $env:STORY_SERVICE_URL = "http://localhost:8000"
          $env:PAYMENT_SERVICE_URL = "http://localhost:8002"
          $env:PHOTO_SERVICE_URL = "http://localhost:8001"

          pytest tests/integration/test_service_contracts.py -v --tb=short -m integration
        timeout-minutes: 10
        continue-on-error: true  # Don't block deployment initially (Level 1→2 migration)
        # TODO: After 3-6 months, change to continue-on-error: false to enforce contract tests (FR-030 Level 2)

  # T080: Security scan stage
  security-scan:
    name: Security Scan
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install safety
        run: pip install safety

      - name: Run Safety check (Python dependencies)
        working-directory: services/story-service
        run: |
          pip install -r requirements.txt
          safety check --json
        continue-on-error: true  # Don't fail on vulnerabilities initially

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'services/story-service'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # T081: Contract compatibility check
  contract-check:
    name: API Contract Validation
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: services/story-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate OpenAPI schema
        working-directory: services/story-service
        run: |
          python -c "
          from src.main import app
          import json
          schema = app.openapi()
          with open('openapi-schema.json', 'w') as f:
              json.dump(schema, f, indent=2)
          "

      - name: Validate API contract
        run: |
          # Compare with previous version (if exists)
          # For now, just verify schema is valid JSON
          python -c "
          import json
          with open('services/story-service/openapi-schema.json', 'r') as f:
              schema = json.load(f)
          print(f'API Contract valid: {len(schema)} keys')
          "

      - name: Upload API schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-schema
          path: services/story-service/openapi-schema.json

  # T082: Docker build stage
  build:
    name: Build Docker Image
    runs-on: windows-latest
    needs: [unit-test, integration-test, security-scan, contract-check]

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/story-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # T083: Deployment stage (blue-green strategy to staging)
  deploy:
    name: Deploy to Staging
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/002-microservices-infra'

    environment:
      name: staging
      url: http://staging.storyme.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Deploy with blue-green strategy
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          # T084: Execute blue-green deployment script
          .\deploy-blue-green.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -ImageTag "${{ github.sha }}" `
            -Environment "staging"

      - name: Monitor deployment health
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          # T086: Monitor deployment for 10 minutes
          .\monitor-deployment.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -DurationMinutes 10 `
            -ErrorRateThreshold 5 `
            -LatencyThresholdMs 500

      - name: Rollback on failure
        if: failure()
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          # T087: Automated rollback if health checks fail
          .\auto-rollback.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -Environment "staging"

      - name: Log deployment
        if: always()
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          # T088: Log deployment to history
          .\log-deployment.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -Version "${{ github.sha }}" `
            -Status "${{ job.status }}" `
            -Environment "staging"

  # Deploy to production (manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: windows-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://api.storyme.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with blue-green strategy
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          .\deploy-blue-green.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -ImageTag "${{ github.sha }}" `
            -Environment "production"

      - name: Monitor deployment health
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          .\monitor-deployment.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -DurationMinutes 10 `
            -ErrorRateThreshold 5 `
            -LatencyThresholdMs 500

      - name: Rollback on failure
        if: failure()
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          .\auto-rollback.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -Environment "production"

      - name: Log deployment
        if: always()
        shell: pwsh
        working-directory: infrastructure/ci-cd/scripts
        run: |
          .\log-deployment.ps1 `
            -ServiceName "${{ env.SERVICE_NAME }}" `
            -Version "${{ github.sha }}" `
            -Status "${{ job.status }}" `
            -Environment "production"

      - name: Create GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.SERVICE_NAME }}-${{ github.sha }}
          release_name: Story Service - ${{ github.sha }}
          body: |
            Automated deployment of Story Service to production

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            Deployed by: ${{ github.actor }}
          draft: false
          prerelease: false
