apiVersion: v1
kind: Service
metadata:
  name: story-service
  labels:
    app: story-service
    tier: backend
  annotations:
    # Consul service registration
    consul.hashicorp.com/service-name: "story-service"
    consul.hashicorp.com/service-tags: "version:v0.1.0,environment:production"
    consul.hashicorp.com/service-port: "8000"

    # Prometheus service discovery
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

spec:
  # T091: ClusterIP for internal service-to-service communication
  type: ClusterIP

  # Session affinity for sticky sessions (optional)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

  selector:
    app: story-service

  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http

    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: http  # Metrics on same port as main service

---
# Headless service for pod-to-pod communication (optional)
apiVersion: v1
kind: Service
metadata:
  name: story-service-headless
  labels:
    app: story-service
    tier: backend
spec:
  clusterIP: None  # Headless service
  selector:
    app: story-service
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: http
