# Alertmanager Configuration
# Routes alerts from Prometheus to notification channels (Slack, PagerDuty, Email)
# Per FR-012: Alert on high error rates, high latency, service down

global:
  # Global defaults
  resolve_timeout: 5m

# Route tree for alert routing
route:
  # Default receiver for all alerts
  receiver: 'default'

  # Group alerts by these labels to reduce notification spam
  group_by: ['alertname', 'cluster', 'service']

  # Wait before sending first notification (allow grouping)
  group_wait: 10s

  # Wait before sending notification about new alerts added to group
  group_interval: 10s

  # Wait before sending notification about resolved alerts
  repeat_interval: 12h

  # Child routes (more specific routing rules)
  routes:
    # Critical alerts (service down) -> PagerDuty
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true  # Also send to default

    # High priority alerts -> Slack + Email
    - match:
        severity: warning
      receiver: 'slack-warnings'

    # Info alerts -> Slack only
    - match:
        severity: info
      receiver: 'slack-info'

# Inhibition rules (suppress certain alerts when others are firing)
inhibit_rules:
  # Suppress warning if critical alert for same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Suppress individual service alerts if entire cluster is down
  - source_match:
      alertname: 'ClusterDown'
    target_match_re:
      alertname: '.*'
    equal: ['cluster']

# Receivers (notification destinations)
receivers:
  # Default receiver (logs only, for development)
  - name: 'default'
