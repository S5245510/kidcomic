# Traefik v3 API Gateway Configuration
# Per T027-T028: Enable Docker provider, Consul catalog, Prometheus metrics, dashboard
# Entrypoints: HTTP :80, Dashboard :8088

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: true  # For development; use TLS in production

# Entry Points
entryPoints:
  web:
    address: ":80"
    # HTTP redirect to HTTPS (disabled for local development)
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https

  websecure:
    address: ":443"
    # TLS configuration for production
    # http:
    #   tls:
    #     certResolver: letsencrypt

  metrics:
    address: ":8082"  # Prometheus metrics endpoint

  traefik:
    address: ":8080"  # Dashboard and API (mapped to host port via docker-compose)

# Providers
providers:
  # Docker provider - auto-discovery of services
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false  # Only expose services with traefik.enable=true label
    network: "kidcomic_default"
    watch: true

  # Consul catalog provider - service discovery
  consulCatalog:
    endpoint:
      address: "consul:8500"
    exposedByDefault: false
    prefix: "traefik"
    constraints: "Tag(`traefik.enable=true`)"
    watch: true
    # Health check configuration
    #healthCheck:
    #  interval: "10s"
    #  timeout: "5s"

  # File provider for dynamic configuration
  file:
    filename: "/etc/traefik/dynamic.yml"
    watch: true

# Metrics
metrics:
  prometheus:
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    entryPoint: "metrics"
    buckets:
      - 0.01  # 10ms
      - 0.05  # 50ms
      - 0.1   # 100ms
      - 0.5   # 500ms
      - 1.0   # 1s
      - 2.0   # 2s
      - 5.0   # 5s

# Logging
log:
  level: "INFO"  # DEBUG, INFO, WARN, ERROR
  format: "json"  # json or common
  filePath: "/var/log/traefik/traefik.log"

# Access Logs (HTTP requests)
accessLog:
  format: "json"
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
  filters:
    statusCodes:
      - "200-299"
      - "400-499"
      - "500-599"
    retryAttempts: true
    minDuration: "10ms"
  fields:
    defaultMode: "keep"
    names:
      ClientUsername: "drop"  # Don't log sensitive data
    headers:
      defaultMode: "keep"
      names:
        Authorization: "drop"  # Don't log auth headers
        X-Auth-Token: "drop"

# Tracing (OpenTelemetry to Tempo)
tracing:
  otlp:
    http:
      endpoint: "http://tempo:4318"
    grpc:
      endpoint: "tempo:4317"
      insecure: true

# Pilot (Traefik Hub - disabled for local)
pilot:
  dashboard: false

# Health Check
ping:
  entryPoint: "traefik"
  manualRouting: false

# TLS (Production)
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: "admin@kidcomic.com"
#       storage: "/letsencrypt/acme.json"
#       httpChallenge:
#         entryPoint: web

# Middleware chains (loaded from file provider)
# See: services/api-gateway/middlewares/*.yml
